<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Swapped default Vite favicon for a custom brand mark (gold pearl on cream). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Basic SEO: description shows in search results and link previews. -->
    <meta name="description" content="Aloha, Tiff Amber — handcrafted Tahitian pearl jewelry made with aloha. Small-batch, island-inspired pieces for everyday wear." />
    <meta name="theme-color" content="#f8f4ed" />

    <!-- Open Graph tags power link previews in iMessage, Instagram DMs, Facebook, LinkedIn, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aloha, Tiff Amber" />
    <meta property="og:description" content="Handcrafted Tahitian pearl jewelry made with aloha." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter card — same info, different format, for x.com previews. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Aloha, Tiff Amber" />
    <meta name="twitter:description" content="Handcrafted Tahitian pearl jewelry made with aloha." />

    <title>Aloha, Tiff Amber</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
